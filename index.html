<style>
:root{
  --bg:#f6f1e7; --ink:#23233a; --muted:#6d6a7c; --card:#ffffff; --line:#e6dfcf;
  --ok:#1f9d55; --ko:#d64545; --accent:#23233a;
  --geo:#2f7fd8; --div:#e0569f; --his:#e8b923; --art:#8a55d6; --sci:#2fa866; --spo:#ef7a2b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17172a; --ink:#f3efe6; --muted:#a29fb5; --card:#23233d; --line:#34345a; --accent:#f3efe6; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
h1{font-size:2.1rem;line-height:1.05;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:1.25rem;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.center{text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.btn{font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--bg);width:100%;margin:6px 0;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:.9rem;margin:0}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
input[type=text]:focus{outline:none;border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.logo{display:flex;justify-content:center;margin:10px 0 0}
.code{font-size:2.6rem;font-weight:700;letter-spacing:.35em;text-align:center;padding-left:.35em}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.plist li:last-child{border:0}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.notice{background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.err{background:#fde2e2;color:#7a1f1f}
/* scoreboard */
.board{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pl{flex:0 0 auto;min-width:92px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 8px 6px;text-align:center;position:relative}
.pl.active{border-color:var(--ink);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.pl .nm{font-size:.85rem;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pl .sc{font-size:.7rem;color:var(--muted)}
.pl.me .nm::after{content:" (toi)";color:var(--muted);font-weight:400}
/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.chip{border-radius:16px;padding:14px 6px;text-align:center;color:#fff;font-weight:600;font-size:.88rem;line-height:1.15;position:relative;opacity:.35;transition:opacity .08s,transform .08s}
.chip .ic{font-size:1.7rem;display:block;margin-bottom:4px}
.chip.on{opacity:1;transform:scale(1.07)}
.chip.idle{opacity:1}
.chip.own::after{content:"●";position:absolute;top:4px;right:8px;font-size:.8rem}
/* question */
.qhead{border-radius:18px 18px 0 0;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:600;animation:pop .35s ease-out}
.qhead .ic{font-size:1.8rem}
.qhead .sub{margin-left:auto;font-size:.8rem;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:99px}
.qbody{background:var(--card);border:2px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:16px}
.qtext{font-size:1.3rem;font-weight:600;line-height:1.25;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:1.05rem;font-weight:500;padding:13px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt:not([disabled]):active{transform:scale(.98)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ok .l{background:rgba(255,255,255,.3)}
.opt.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.opt.ko .l{background:rgba(255,255,255,.3)}
.opt.dim{opacity:.45}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 4px}
.timer>i{display:block;height:100%;width:100%;background:var(--ink);transition:width .2s linear}
.verdict{font-size:1.2rem;font-weight:700;margin:10px 0 2px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.winner{font-size:3.2rem;text-align:center;margin:8px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.95rem;z-index:9;max-width:90vw}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;

  background-size:auto,auto,160px 160px;opacity:.9;transition:opacity .4s}
body.focus::before{opacity:.4}
@media (prefers-color-scheme: dark){body::before{opacity:.35} body.focus::before{opacity:.15}}

body.screen #app{max-width:1200px;padding:24px 32px}
body.screen .board{flex-wrap:wrap;justify-content:center;overflow:visible}
body.screen .pl{min-width:160px;padding:14px 12px}
body.screen .pl svg{width:104px;height:104px}
body.screen .pl .nm{font-size:1.25rem;max-width:150px}
body.screen .pl .sc{font-size:.95rem}
body.screen h1{font-size:3rem}
body.screen .chips{grid-template-columns:repeat(6,1fr)}
body.screen .chip{font-size:1rem;padding:22px 6px}
body.screen .qhead{font-size:1.6rem;padding:16px 22px}
body.screen .qtext{font-size:2.3rem}
body.screen .opts{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
body.screen .opt{font-size:1.5rem;padding:20px 22px}
body.screen .verdict{font-size:1.8rem}
.code.big{font-size:6rem}
.screenlobby{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:12px}
@media (max-width:800px){.screenlobby{grid-template-columns:1fr}}
</style>

function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Délai dépassé')),ms))]);

/* normalisation des snapshots db */
function docData(s){
  if(!s)return null;
  if(typeof s.data==='function'){const ex=typeof s.exists==='function'?s.exists():s.exists;if(ex===false)return null;return s.data()||null}
  return s;
}
function colDocs(s){
  const arr=s&&s.docs?s.docs:(Array.isArray(s)?s:[]);
  return arr.map(d=>typeof d.data==='function'?{id:d.id,...d.data()}:d);
}

/* ============================================================
   LOGIQUE DE JEU
   ============================================================ */
const newGame=(c,host)=>({code:c,host,status:'lobby',level:'e',board:false,order:[],turn:0,phase:'roll',q:null,result:null,used:[],winner:null,createdAt:Date.now()});
const newPlayer=(id,name)=>({id,name,wedges:[],ok:0,ko:0,joinedAt:Date.now()});
const activeId=()=>game&&game.order.length?game.order[game.turn%game.order.length]:null;
const isMyTurn=()=>mode==='local'||activeId()===me.id;
const isHost=()=>mode==='local'||(game&&game.board?screenFlag:(game&&game.host===me.id));
const nm=id=>players[id]?players[id].name:'Joueur';
const genCode=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[rnd(L.length)];return s};

async function saveGame(patch){
  Object.assign(game,patch);
  if(mode==='online'){try{await dbh.doc('games/'+code).update(patch)}catch(e){toast('Synchronisation impossible')}}
  render();
}
async function savePlayer(id,patch){
  Object.assign(players[id],patch);
  if(mode==='online'){try{await dbh.doc(`games/${code}/players/${id}`).update(patch)}catch(e){toast('Synchronisation impossible')}}
}

async function startGame(){
  if(!isHost())return;
  const ids=Object.keys(players);
  if(mode==='online'&&ids.length<2)return;
  if(!ids.length)return;
  for(const id of ids)await savePlayer(id,{wedges:[],ok:0,ko:0});
  await saveGame({status:'playing',order:shuffle(ids),turn:0,phase:'roll',q:null,result:null,used:[],winner:null});
}

function drawQuestion(catId,hard){
  const t=hard?'h':'e';
  const pool=BANK[catId][t].map((_,i)=>`${catId}:${t}:${i}`);
  let free=pool.filter(k=>!game.used.includes(k));
  let used=game.used.slice();
  if(!free.length){used=used.filter(k=>!pool.includes(k));free=pool}
  const key=free[rnd(free.length)];
  used.push(key);
  return {key,used};
}

async function roll(pick){
  if(!game||game.phase!=='roll'||!isMyTurn())return;
  const id=activeId(), p=players[id];
  const final=p.wedges.length>=WEDGES_TO_WIN;
  const cat=CATS[final?rnd(CATS.length):pick];
  const wedge=!final&&!p.wedges.includes(cat.id)&&Math.random()<0.34;
  const hard=(game.level||'e')==='h';
  const {key,used}=drawQuestion(cat.id,hard);
  const q={cat:cat.id,key,wedge,final,hard,opts:shuffle([0,1,2,3]),t0:Date.now()};
  await saveGame({phase:'question',q,used,result:null});
}

async function answer(choice){
  if(!game||game.phase!=='question'||!isMyTurn()||busy)return;
  busy=true;
  try{
    const q=game.q, id=activeId(), p=players[id];
    const correct=choice>=0&&q.opts[choice]===0;
    const result={choice,correct};
    if(correct){
      const patch={ok:(p.ok||0)+1};
      if(q.wedge&&!p.wedges.includes(q.cat))patch.wedges=[...p.wedges,q.cat];
      await savePlayer(id,patch);
    }else await savePlayer(id,{ko:(p.ko||0)+1});
    if(correct&&q.final)await saveGame({phase:'result',result,status:'finished',winner:id});
    else await saveGame({phase:'result',result});
  }finally{busy=false}
}

async function nextStep(){
  if(!game||game.phase!=='result'||!isMyTurn())return;
  const keep=game.result&&game.result.correct;
  await saveGame({phase:'roll',q:null,result:null,turn:keep?game.turn:game.turn+1});
}
async function skipPlayer(){
  if(!isHost())return;
  await saveGame({phase:'roll',q:null,result:null,turn:game.turn+1});
}
async function rematch(){
  if(!isHost())return;
  for(const id of Object.keys(players))await savePlayer(id,{wedges:[],ok:0,ko:0});
  await saveGame({status:'lobby',order:[],turn:0,phase:'roll',q:null,result:null,used:[],winner:null});
}

/* ============================================================
   CONNEXION
   ============================================================ */
function clearSubs(){unsubs.forEach(u=>{try{typeof u==='function'&&u()}catch(e){}});unsubs=[]}
function resetSession(){screenFlag=false;clearSubs();mode=null;code=null;game=null;players={};screen='home';rolling=null;busy=false;store('gc_last',null)}

function subscribe(c){
  code=c;mode='online';screen='game';
  unsubs.push(dbh.doc('games/'+c).onSnapshot(s=>{game=docData(s);render()}));
  unsubs.push(dbh.collection(`games/${c}/players`).onSnapshot(s=>{
    const next={};colDocs(s).forEach(p=>{if(p&&p.id)next[p.id]=p});players=next;render()}));
  store('gc_last',JSON.stringify({code:c,screen:screenFlag}));
}

async function createOnline(name){
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  me.name=name;store('gc_name',name);
  try{
    const c=genCode();
    await withTimeout(dbh.doc('games/'+c).set(newGame(c,me.id)),10000);
    await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).set(newPlayer(me.id,name)),10000);
    subscribe(c);render();
  }catch(e){fail('Impossible de créer la partie : '+(e.message||e))}
}
async function createScreen(){
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  try{
    const c=genCode();const g=newGame(c,me.id);g.board=true;
    await withTimeout(dbh.doc('games/'+c).set(g),10000);
    screenFlag=true;subscribe(c);render();
  }catch(e){screenFlag=false;fail('Impossible de créer la partie : '+(e.message||e))}
}
async function joinOnline(name,c){
  c=(c||'').trim().toUpperCase();
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  if(c.length!==4)return fail('Le code comporte 4 lettres.');
  me.name=name;store('gc_name',name);
  try{
    const g=docData(await withTimeout(dbh.doc('games/'+c).get(),10000));
    if(!g)return fail('Partie introuvable. Vérifie le code.');
    const mine=docData(await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).get(),10000));
    if(!mine){
      if(g.status!=='lobby')return fail('Cette partie a déjà commencé.');
      await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).set(newPlayer(me.id,name)),10000);
    }
    subscribe(c);render();
  }catch(e){fail('Impossible de rejoindre : '+(e.message||e))}
}
async function resume(){
  const l=JSON.parse(store('gc_last')||'null');
  if(l&&l.code&&l.screen&&dbh){screenFlag=true;subscribe(l.code);render();return}
  if(l&&l.code)joinOnline(me.name||store('gc_name')||'Joueur',l.code);
}
function startLocal(){
  mode='local';code='LOCAL';game=newGame('LOCAL','p1');players={};screen='game';
  render();
}
function addLocalPlayer(name){
  name=(name||'').trim();if(!name)return;
  const id='p'+(Object.keys(players).length+1);
  players[id]=newPlayer(id,name.slice(0,16));
  render();
  const i=$('#addname');if(i)i.focus();
}
function fail(msg){notice=msg;noticeErr=true;render()}
function leave(){resetSession();render()}

function pie(w,size){
  const r=size/2;let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  CATS.forEach((c,i)=>{
    const a0=-Math.PI/2+i*Math.PI/3,a1=a0+Math.PI/3,R=r-1;
    const x0=r+R*Math.cos(a0),y0=r+R*Math.sin(a0),x1=r+R*Math.cos(a1),y1=r+R*Math.sin(a1);
    s+=`<path d="M${r} ${r}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${w.includes(c.id)?c.color:'#d9d2c0'}" stroke="#fff" stroke-width="2"/>`;
  });
  return s+'</svg>';
}
const logo=()=>`<div class="logo">${pie(CATS.map(c=>c.id),92)}</div>`;

function render(){
  const app=$('#app');
  if(!app)return;
  let html='';
  if(screen==='home')html=viewHome();
  else if(!game)html=`<div class="card center"><p>Connexion à la partie…</p><button class="btn alt" data-act="leave">Annuler</button></div>`;
  else if(game.status==='lobby')html=viewLobby();
  else if(game.status==='finished')html=viewFinished();
  else html=viewGame();
  app.innerHTML=html;
  document.body.classList.toggle('screen',screenFlag&&screen==='game');
  document.body.classList.toggle('focus',screen==='game'&&!!game&&game.status==='playing'&&game.phase!=='roll');
  syncTimer();
}

function board(){
  return `<div class="board">${game.order.map(id=>{const p=players[id];if(!p)return '';
    return `<div class="pl ${id===activeId()?'active':''} ${id===me.id&&mode==='online'?'me':''}">${pie(p.wedges||[],52)}<div class="nm">${esc(p.name)}</div><div class="sc">${p.ok||0} ✓ · ${p.ko||0} ✗</div></div>`}).join('')}</div>`;
}

function viewGame(){
  const aid=activeId(), ap=players[aid];
  if(!ap)return `<div class="card center"><p>Synchronisation…</p></div>`;
  let main='';
  if(game.phase==='roll')main=viewRoll(ap);
  else main=viewQuestion(ap);
  const foot=`<div class="row" style="margin-top:18px">${isHost()&&mode==='online'?`<button class="btn small alt" data-act="skip">Passer ${esc(ap.name)}</button>`:'<span></span>'}<button class="btn small alt" data-act="leave" style="margin-left:auto;flex:0 0 auto">Quitter</button></div>`;
  return board()+main+foot;
}

function viewRoll(ap){
  const mine=isMyTurn();
  const final=ap.wedges.length>=WEDGES_TO_WIN;
  const chips=CATS.map((c,i)=>`<div class="chip ${rolling?(rolling.on===i?'on':''):'idle'} ${ap.wedges.includes(c.id)?'own':''}" style="background:${c.color}"><span class="ic">${c.icon}</span>${c.name}</div>`).join('');
  return `<div class="card center" style="margin-top:6px">
    <p class="muted" style="margin:0">${mine?(mode==='local'?`Au tour de`:'À toi de jouer,'):'Au tour de'}</p>
    <h1 style="margin:0 0 4px">${esc(ap.name)}</h1>
    ${final?'<p><b>🏆 Les six camemberts sont là ! Prochaine question : la finale.</b></p>':`<p class="muted" style="margin:0">${ap.wedges.length} camembert${ap.wedges.length>1?'s':''} sur ${WEDGES_TO_WIN}</p>`}
    <div class="chips">${chips}</div>
    ${mine?`<button class="btn" data-act="roll" ${rolling?'disabled':''}>🎲 Lancer le dé</button>`:`<p class="muted">${esc(ap.name)} s'apprête à lancer le dé…</p>`}
  </div>`;
}

function viewQuestion(ap){
  const q=game.q, cat=catById(q.cat), item=getQ(q.key);
  const texts=q.opts.map(i=>item[1+i]);
  const correctIdx=q.opts.indexOf(0);
  const isRes=game.phase==='result';
  const mine=isMyTurn();
  const sub=(q.final?'Question finale':(q.wedge?'Question camembert':''))||levelName(game.level||'e');
  let opts=texts.map((t,i)=>{
    let cls='';
    if(isRes){cls=i===correctIdx?'ok':(game.result.choice===i?'ko':'dim')}
    return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${(!mine||isRes)?'disabled':''}><span class="l">${'ABCD'[i]}</span><span>${esc(t)}</span></button>`;
  }).join('');
  let extra='';
  if(isRes){
    const r=game.result;
    if(r.correct){
      extra=`<div class="verdict ok">Bonne réponse !</div><p>${q.final?'Quelle finale !':q.wedge?`${esc(ap.name)} gagne le camembert ${esc(cat.name)} !`:`${esc(ap.name)} rejoue.`}</p>`;
    }else{
      const nxt=game.order[(game.turn+1)%game.order.length];
      extra=`<div class="verdict ko">${r.choice<0?'Temps écoulé !':'Raté…'}</div><p>La bonne réponse : <b>${esc(texts[correctIdx])}</b>.</p><p class="muted">${game.order.length>1?`Au tour de ${esc(nm(nxt))}.`:'On retente !'}</p>`;
    }
    extra+=mine?`<button class="btn" data-act="next">Continuer</button>`:`<p class="muted center">En attente de ${esc(ap.name)}…</p>`;
  }else{
    extra=mine?`<div class="timer"><i id="tbar"></i></div><p class="muted" style="margin:2px 0 0;font-size:.85rem"><span id="tleft">${QTIME} s</span></p>`:`<p class="muted center" style="margin-top:10px">${esc(ap.name)} réfléchit…</p>`;
  }
  return `<div style="margin-top:6px"><div class="qhead" style="background:${cat.color}"><span class="ic">${cat.icon}</span>${esc(cat.name)}${sub?`<span class="sub">${sub}</span>`:''}</div>
  <div class="qbody"><div class="muted" style="font-size:.85rem;margin-bottom:2px">${esc(ap.name)}</div><div class="qtext">${esc(item[0])}</div><div class="opts">${opts}</div>${extra}</div></div>`;
}

function viewFinished(){
  const w=players[game.winner];
  const ids=Object.keys(players).sort((a,b)=>(players[b].wedges||[]).length-(players[a].wedges||[]).length||(players[b].ok||0)-(players[a].ok||0));
  return `<div class="winner">🏆</div>
  <h1 class="center">${esc(w?w.name:'Quelqu\'un')} remporte la partie !</h1>
  <div class="card"><ul class="plist">${ids.map(id=>{const p=players[id];return `<li>${pie(p.wedges||[],34)}<b>${esc(p.name)}</b><span class="muted" style="margin-left:auto">${p.ok||0} bonnes · ${p.ko||0} ratées</span></li>`}).join('')}</ul></div>
  ${isHost()?`<button class="btn" data-act="rematch">Nouvelle partie</button>`:`<p class="center muted">${game.board?'En attente d\'une revanche lancée depuis l\'écran de jeu…':`En attente d'une revanche proposée par ${esc(nm(game.host))}…`}</p>`}
  <button class="btn alt" data-act="leave">Quitter</button>`;
}

/* ============================================================
   TIMER & ÉVÉNEMENTS
   ============================================================ */
function syncTimer(){
  const need=screen==='game'&&game&&game.status==='playing'&&game.phase==='question'&&game.q&&isMyTurn();
  if(!need){if(timerIv){clearInterval(timerIv);timerIv=null;timerKey=null}return}
  const tick=()=>{
    const left=QTIME-(Date.now()-game.q.t0)/1000;
    const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,left/QTIME*100)+'%';
    const tl=$('#tleft');if(tl)tl.textContent=Math.max(0,Math.ceil(left))+' s';
    if(left<=0){clearInterval(timerIv);timerIv=null;timerKey=null;answer(-1)}
  };
  if(timerKey===game.q.t0){tick();return}
  clearInterval(timerIv);timerKey=game.q.t0;timerIv=setInterval(tick,200);tick();
}

function startRoll(){
  if(rolling||!isMyTurn()||game.phase!=='roll')return;
  const pick=rnd(CATS.length);let n=0;const steps=10+rnd(4);
  rolling={on:rnd(CATS.length)};render();
  const iv=setInterval(()=>{
    n++;
    if(n>=steps){clearInterval(iv);rolling={on:pick};render();setTimeout(()=>{rolling=null;roll(pick)},550);return}
    rolling={on:(rolling.on+1+rnd(2))%CATS.length};render();
  },100+n*6);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a!=='create'&&a!=='join'){notice='';noticeErr=false}
  if(a==='create'){const n=($('#pname').value||'').trim();if(!n)return fail('Entre ton prénom.');notice='';createOnline(n.slice(0,16))}
  else if(a==='join'){const n=($('#pname').value||'').trim();if(!n)return fail('Entre ton prénom.');notice='';joinOnline(n.slice(0,16),$('#jcode').value)}
  else if(a==='screen')createScreen();
  else if(a==='resume')resume();
  else if(a==='local')startLocal();
  else if(a==='addlocal')addLocalPlayer($('#addname').value);
  else if(a==='level'){if(isHost())saveGame({level:b.dataset.lv})}
  else if(a==='start')startGame();
  else if(a==='roll')startRoll();
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='next')nextStep();
  else if(a==='skip')skipPlayer();
  else if(a==='rematch')rematch();
  else if(a==='leave')leave();
  else if(a==='copy'){try{navigator.clipboard.writeText(code).then(()=>toast('Code copié'),()=>toast('Code : '+code))}catch(err){toast('Code : '+code)}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='addname')addLocalPlayer(e.target.value);
});

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function initFirebase(){
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG||!FIREBASE_CONFIG.projectId)return null;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs=firebase.firestore();
    const wrapDoc=p=>{const r=fs.doc(p);return{
      set:d=>r.set(d),update:d=>r.update(d),get:()=>r.get(),
      onSnapshot:cb=>r.onSnapshot(cb,e=>toast('Synchro Firebase : '+(e.code||e.message)))
    }};
    return{doc:wrapDoc,collection:p=>{const r=fs.collection(p);return{onSnapshot:cb=>r.onSnapshot(cb,e=>toast('Synchro Firebase : '+(e.code||e.message)))}}};
  }catch(e){return null}
}
(async function init(){
  me.name=store('gc_name')||'';
  render();
  try{
    if(typeof claude!=='undefined'&&claude.use){
      userCap=await claude.use('user').catch(()=>null);
      dbh=await claude.use('db').catch(()=>null);
    }
  }catch(e){}
  if(!dbh)dbh=initFirebase();
  me.id=localId();
  capsReady=true;
  if(screen==='home')render();
})();
</script>
