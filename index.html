<style>
:root{
  --bg:#eef1f8; --bg2:#e2e7f4; --ink:#1d1e3a; --muted:#6b6f8c; --card:#ffffff; --line:#e4e7f2;
  --ok:#12a150; --ko:#e0485a; --accent:#5b4be0; --accent2:#8b5cf6;
  --shadow:0 10px 30px rgba(29,30,58,.10); --shadow-sm:0 4px 14px rgba(29,30,58,.08);
  --geo:#3b82f6; --div:#ec4899; --his:#f59e0b; --art:#8b5cf6; --sci:#10b981; --spo:#f97316;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141427; --bg2:#1b1b33; --ink:#f1effb; --muted:#9a9bc0; --card:#232343; --line:#343463; --accent:#7c6cff; --accent2:#a78bfa;
    --shadow:0 12px 34px rgba(0,0,0,.4); --shadow-sm:0 4px 16px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
h1{font-size:2.1rem;line-height:1.05;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:1.25rem;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow-sm)}
.btn{font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;margin:6px 0;transition:transform .08s,box-shadow .15s;box-shadow:0 6px 18px rgba(91,75,224,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.small{width:auto;padding:9px 15px;font-size:.9rem;margin:0}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
input[type=text]:focus{outline:none;border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.logo{display:flex;justify-content:center;margin:10px 0 0}
.code{font-size:2.6rem;font-weight:700;letter-spacing:.3em;text-align:center;padding:10px .1em 10px .4em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;box-shadow:var(--shadow-sm)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.plist li:last-child{border:0}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.notice{background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.err{background:#fde2e2;color:#7a1f1f}
/* scoreboard */
.board{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pl{flex:0 0 auto;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 8px;text-align:center;position:relative;box-shadow:var(--shadow-sm);transition:transform .12s}
.pl.active{border-color:transparent;box-shadow:0 0 0 2.5px var(--accent),var(--shadow);transform:translateY(-3px)}
.pl .nm{font-size:.85rem;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pl .sc{font-size:.7rem;color:var(--muted)}
.pl.me .nm::after{content:" (toi)";color:var(--muted);font-weight:400}
/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.chip{border-radius:16px;padding:14px 6px;text-align:center;color:#fff;font-weight:600;font-size:.88rem;line-height:1.15;position:relative;opacity:.35;transition:opacity .08s,transform .08s}
.chip .ic{font-size:1.7rem;display:block;margin-bottom:4px}
.chip.on{opacity:1;transform:scale(1.07)}
.chip.idle{opacity:1}
.chip.own::after{content:"●";position:absolute;top:4px;right:8px;font-size:.8rem}
/* question */
.qhead{border-radius:22px 22px 0 0;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:600;animation:pop .35s ease-out;box-shadow:var(--shadow-sm);text-shadow:0 1px 2px rgba(0,0,0,.18)}
.qhead .ic{font-size:1.9rem}
.qhead .sub{margin-left:auto;font-size:.8rem;background:rgba(255,255,255,.28);padding:4px 11px;border-radius:99px;text-shadow:none}
.qbody{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;padding:18px;box-shadow:var(--shadow-sm)}
.qtext{font-size:1.3rem;font-weight:600;line-height:1.25;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:1.05rem;font-weight:500;padding:14px 15px;margin:9px 0;border-radius:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .08s,border-color .12s}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt:not([disabled]):active{transform:scale(.98)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ok .l{background:rgba(255,255,255,.3)}
.opt.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.opt.ko .l{background:rgba(255,255,255,.3)}
.opt.dim{opacity:.45}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 4px}
.timer>i{display:block;height:100%;width:100%;background:var(--ink);transition:width .2s linear}
.verdict{font-size:1.2rem;font-weight:700;margin:10px 0 2px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.winner{font-size:3.2rem;text-align:center;margin:8px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.95rem;z-index:9;max-width:90vw}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 0%,rgba(224,86,159,.18),transparent 45%),radial-gradient(circle at 90% 10%,rgba(47,127,216,.18),transparent 45%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><circle cx='20' cy='24' r='9' fill='%232f7fd8'/><rect x='88' y='14' width='16' height='16' rx='4' transform='rotate(20 96 22)' fill='%23e0569f'/><path d='M130 30l11 19h-22z' fill='%23e8b923'/><circle cx='70' cy='70' r='6' fill='%238a55d6'/><path d='M18 96a12 12 0 0 1 24 0z' fill='%232fa866'/><rect x='108' y='84' width='14' height='14' rx='7' fill='%23ef7a2b'/><path d='M64 130l10 17H54z' fill='%232f7fd8'/><circle cx='128' cy='134' r='8' fill='%23e0569f'/><rect x='14' y='134' width='12' height='12' rx='3' transform='rotate(-15 20 140)' fill='%23e8b923'/></svg>");
  background-size:auto,auto,160px 160px;opacity:.9;transition:opacity .4s}
body.focus::before{opacity:.4}
@media (prefers-color-scheme: dark){body::before{opacity:.35} body.focus::before{opacity:.15}}
.qhead,.qbody{box-shadow:0 6px 0 rgba(35,35,58,.12)}
.qbody{padding:20px 18px}
.qtext{font-size:1.5rem;line-height:1.28}

body.screen #app{max-width:1280px;padding:22px 28px}
body.screen .board{flex-wrap:wrap;justify-content:flex-start;overflow:visible;gap:6px}
body.screen .pl{min-width:92px;padding:7px 8px 6px}
body.screen .pl svg{width:56px;height:56px}
body.screen .pl .nm{font-size:.82rem;max-width:96px}
body.screen .pl .sc{font-size:.72rem}
body.screen h1{font-size:1.8rem}
body.screen .card{padding:14px}
body.screen .qhead{font-size:1.2rem;padding:12px 16px}
body.screen .qtext{font-size:1.55rem}

body.screen .opt{font-size:1.15rem;padding:14px 16px}
body.screen .verdict{font-size:1.4rem}
body.screen .die{font-size:3.4rem}
.code.big{font-size:6rem}
.screengame{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:24px;align-items:start;margin-top:8px}
@media (max-width:860px){.screengame{grid-template-columns:1fr}}
.plateau{position:relative}
.screengame .plateau{position:sticky;top:12px}
.plateau svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
.screencol{min-width:0}
body.screen .screengame .board{flex-wrap:wrap;justify-content:flex-start}
.die{font-size:4.2rem;line-height:1;margin:6px 0;animation:pop .25s ease-out}
.opt.move .l{color:#fff;font-weight:800}
.opt-ring{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.pdot{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #15151f;vertical-align:-2px;margin-right:2px;flex:0 0 auto}
.pdot.clik{cursor:pointer}
.cell-hit{cursor:pointer}
.plateau svg .cell-hit:active{fill:var(--accent);opacity:.2}
.opt-glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:.6}}
.legendbar{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:6px 0 12px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px;box-shadow:var(--shadow-sm)}
.lchip .ldot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
body.screen .legendbar{gap:10px;margin-bottom:14px}
body.screen .lchip{font-size:1rem;padding:7px 15px}
/* écran de lancement (splash) */
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;
  background:radial-gradient(130% 130% at 50% 0%,var(--accent2),var(--accent) 55%,#2d2a63);
  animation:splashOut .55s ease-in forwards;animation-delay:1.9s}
.splash-inner{text-align:center;color:#fff;padding:24px}
.splash-logo{display:inline-block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:logoIn .8s cubic-bezier(.2,1.3,.4,1) both}
.splash-logo svg{display:block}
.splash-title{font-size:2.3rem;font-weight:700;margin-top:18px;letter-spacing:-.5px;animation:riseIn .6s ease-out .35s both}
.splash-sub{font-size:1.05rem;opacity:.9;margin-top:4px;animation:riseIn .6s ease-out .5s both}
.splash-dots{display:flex;gap:8px;justify-content:center;margin-top:22px;animation:riseIn .6s ease-out .65s both}
.splash-dots i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.6;animation:dot 1s ease-in-out infinite}
.splash-dots i:nth-child(2){animation-delay:.15s}
.splash-dots i:nth-child(3){animation-delay:.3s}
#splash.gone{display:none}
@keyframes logoIn{0%{transform:scale(.2) rotate(-120deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes riseIn{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-7px);opacity:1}}
@keyframes splashOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation-delay:.8s}.splash-logo,.splash-title,.splash-sub,.splash-dots{animation:none}}
.screenlobby{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:12px}
@media (max-width:800px){.screenlobby{grid-template-columns:1fr}}
</style>

/* ---------- Plateau facon Trivial Pursuit : anneau + 6 rayons + centre ---------- */
const BOARD=(function(){
  const cx=235,cy=235,Rr=205,Ra=150,Rb=96;
  const nodes={},adj={};
  const link=(x,y)=>{(adj[x]=adj[x]||[]).push(y);(adj[y]=adj[y]||[]).push(x)};
  for(let p=0;p<36;p++){
    const ang=-Math.PI/2+p/36*2*Math.PI, seg=Math.floor(p/6), hq=(p%6===0);
    const cat=hq?CATS[seg%6].id:CATS[(p+seg)%6].id;
    nodes['R'+p]={x:cx+Rr*Math.cos(ang),y:cy+Rr*Math.sin(ang),cat,type:hq?'hq':'cat'};
  }
  for(let p=0;p<36;p++)link('R'+p,'R'+((p+1)%36));
  nodes['H']={x:cx,y:cy,cat:null,type:'hub'};
  for(let s=0;s<6;s++){
    const rp=s*6+3, ang=-Math.PI/2+rp/36*2*Math.PI;
    nodes['S'+s+'a']={x:cx+Ra*Math.cos(ang),y:cy+Ra*Math.sin(ang),cat:CATS[(s*2+2)%6].id,type:'cat'};
    nodes['S'+s+'b']={x:cx+Rb*Math.cos(ang),y:cy+Rb*Math.sin(ang),cat:CATS[(s*2+4)%6].id,type:'cat'};
    link('R'+rp,'S'+s+'a');link('S'+s+'a','S'+s+'b');link('S'+s+'b','H');
  }
  return {nodes,adj,cx,cy};
})();
/* toutes les cases atteignables en exactement `steps` pas, sans demi-tour immediat */
function reachable(from,steps){
  const res=new Set();
  (function dfs(node,prev,left){
    if(left===0){res.add(node);return}
    for(const nx of BOARD.adj[node]){if(nx===prev)continue;dfs(nx,node,left-1)}
  })(from,null,steps);
  return [...res];
}

async function saveGame(patch){

  render();

async function savePlayer(id,patch){
  Object.assign(players[id],patch);
  if(mode==='online'){try{await dbh.doc(`games/${code}/players/${id}`).update(patch)}catch(e){toast('Synchronisation impossible')}}
}

async function startGame(){
  if(!isHost())return;
  const ids=Object.keys(players);
  if(mode==='online'&&ids.length<2)return;
  if(!ids.length)return;
  for(const id of ids)await savePlayer(id,{wedges:[],ok:0,ko:0,pos:'H'});
  await saveGame({status:'playing',order:shuffle(ids),turn:0,phase:'roll',moveN:null,options:null,q:null,result:null,used:[],winner:null});
}

function drawQuestion(catId,hard){
  const t=hard?'h':'e';
  const pool=BANK[catId][t].map((_,i)=>`${catId}:${t}:${i}`);
  let free=pool.filter(k=>!game.used.includes(k));
  let used=game.used.slice();
  if(!free.length){used=used.filter(k=>!pool.includes(k));free=pool}
  const key=free[rnd(free.length)];
  used.push(key);
  return {key,used};
}

/* 1) le joueur lance le de -> on calcule les cases possibles */
async function rollDice(n){
  if(!game||game.phase!=='roll'||!isMyTurn())return;
  const from=players[activeId()].pos||'H';
  const options=reachable(from,n);
  await saveGame({phase:'move',moveN:n,options,q:null,result:null});
}

/* 2) le joueur choisit sa case -> question, QG, ou centre */
async function chooseMove(node){
  if(!game||game.phase!=='move'||!isMyTurn())return;
  if(!game.options||!game.options.includes(node))return;
  const id=activeId();
  await savePlayer(id,{pos:node});
  const nd=BOARD.nodes[node], p=players[id];
  if(nd.type==='hub'){
    if(hasAll(p)){await startQuestion(CATS[rnd(CATS.length)].id,false,true);}
    else{await saveGame({phase:'roll',moveN:null,options:null});toast('Au centre : relance le dé');}
    return;
  }
  await startQuestion(nd.cat,nd.type==='hq',false);
}

async function startQuestion(catId,wedge,final){
  // QG (camembert) et finale toujours difficiles ; sinon 70% difficile / 30% simple
  const hard=wedge||final||Math.random()<0.70;
  const {key,used}=drawQuestion(catId,hard);
  const q={cat:catId,key,wedge:wedge&&!final,final,hard,opts:shuffle([0,1,2,3]),t0:Date.now()};
  await saveGame({phase:'question',q,used,result:null,moveN:null,options:null});
}

async function answer(choice){
  if(!game||game.phase!=='question'||!isMyTurn()||busy)return;
  busy=true;
  try{
    const q=game.q, id=activeId(), p=players[id];
    const correct=choice>=0&&q.opts[choice]===0;
    const result={choice,correct};
    if(correct){
      const patch={ok:(p.ok||0)+1};
      if(q.wedge&&!(p.wedges||[]).includes(q.cat))patch.wedges=[...(p.wedges||[]),q.cat];
      await savePlayer(id,patch);
    }else await savePlayer(id,{ko:(p.ko||0)+1});
    if(correct&&q.final)await saveGame({phase:'result',result,status:'finished',winner:id});
    else await saveGame({phase:'result',result});
  }finally{busy=false}
}

async function nextStep(){
  if(!game||game.phase!=='result'||!isMyTurn())return;
  const keep=game.result&&game.result.correct;
  await saveGame({phase:'roll',q:null,result:null,moveN:null,options:null,turn:keep?game.turn:game.turn+1});
}
async function skipPlayer(){
  if(!isHost())return;
  await saveGame({phase:'roll',q:null,result:null,moveN:null,options:null,turn:game.turn+1});
}
async function rematch(){
  if(!isHost())return;
  for(const id of Object.keys(players))await savePlayer(id,{wedges:[],ok:0,ko:0,pos:'H'});
  await saveGame({status:'lobby',order:[],turn:0,phase:'roll',moveN:null,options:null,q:null,result:null,used:[],winner:null});
}

let pollIv=null,lastSig='';
function clearSubs(){unsubs.forEach(u=>{try{typeof u==='function'&&u()}catch(e){}});unsubs=[];if(pollIv){clearInterval(pollIv);pollIv=null}}
function resetSession(){screenFlag=false;clearSubs();mode=null;code=null;game=null;players={};screen='home';rolling=null;busy=false;store('gc_last',null)}

/* Filet de sécurité : si un événement temps réel est manqué (veille du téléphone,
   réseau instable), on resynchronise périodiquement et au réveil de l'onglet. */
async function refreshOnce(){
  if(mode!=='online'||!dbh||!code)return;
  try{
    const g=docData(await dbh.doc('games/'+code).get());
    if(g)game=g;
    if(dbh.collection(`games/${code}/players`).get){
      const next={};colDocs(await dbh.collection(`games/${code}/players`).get()).forEach(p=>{if(p&&p.id)next[p.id]=p});
      if(Object.keys(next).length)players=next;
    }
    if(stateSig()!==lastSig)render();
  }catch(e){}
}
function subscribe(c){
  code=c;mode='online';screen='game';
  unsubs.push(dbh.doc('games/'+c).onSnapshot(s=>{game=docData(s);render()}));
  unsubs.push(dbh.collection(`games/${c}/players`).onSnapshot(s=>{
    const next={};colDocs(s).forEach(p=>{if(p&&p.id)next[p.id]=p});players=next;render()}));
  if(pollIv)clearInterval(pollIv);
  pollIv=setInterval(refreshOnce,3000);
  store('gc_last',JSON.stringify({code:c,screen:screenFlag}));
}
function stateSig(){
  if(!game)return 's:'+screen;
  return JSON.stringify([screen,game.status,game.turn,game.phase,game.q&&game.q.key,game.q&&game.q.t0,
    game.result&&game.result.choice,game.winner,
    Object.keys(players).sort().map(id=>[id,(players[id].wedges||[]).length,players[id].ok,players[id].ko])]);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOnce()});
window.addEventListener('focus',refreshOnce);
window.addEventListener('online',refreshOnce);

async function createOnline(name){
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  me.name=name;store('gc_name',name);
  try{
    const c=genCode();
    await withTimeout(dbh.doc('games/'+c).set(newGame(c,me.id)),10000);
    await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).set(newPlayer(me.id,name,TOKCOL[0])),10000);
    subscribe(c);render();
  }catch(e){fail('Impossible de créer la partie : '+(e.message||e))}
}
async function createScreen(){
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  try{
    const c=genCode();const g=newGame(c,me.id);g.board=true;
    await withTimeout(dbh.doc('games/'+c).set(g),10000);
    screenFlag=true;subscribe(c);render();
  }catch(e){screenFlag=false;fail('Impossible de créer la partie : '+(e.message||e))}
}
async function joinOnline(name,c){
  c=(c||'').trim().toUpperCase();
  if(!dbh||!me.id)return fail('Le mode en ligne n\'est pas disponible ici (connexion requise).');
  if(c.length!==4)return fail('Le code comporte 4 lettres.');
  me.name=name;store('gc_name',name);
  try{
    const g=docData(await withTimeout(dbh.doc('games/'+c).get(),10000));
    if(!g)return fail('Partie introuvable. Vérifie le code.');
    const mine=docData(await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).get(),10000));
    if(!mine){
      if(g.status!=='lobby')return fail('Cette partie a déjà commencé.');
      let color=TOKCOL[0],used=[];
      try{const col=dbh.collection(`games/${c}/players`);if(col.get){const ps=colDocs(await col.get());used=ps.map(p=>p.color).filter(Boolean);if(ps.length>=MAXP)return fail('Partie complète ('+MAXP+' joueurs max).');color=pickColor(used)}}catch(e){}
      await withTimeout(dbh.doc(`games/${c}/players/${me.id}`).set(newPlayer(me.id,name,color)),10000);
    }
    subscribe(c);render();
  }catch(e){fail('Impossible de rejoindre : '+(e.message||e))}
}
async function resume(){
  const l=JSON.parse(store('gc_last')||'null');
  if(l&&l.code&&l.screen&&dbh){screenFlag=true;subscribe(l.code);render();return}
  if(l&&l.code)joinOnline(me.name||store('gc_name')||'Joueur',l.code);
}

  name=(name||'').trim();if(!name)return;

function pie(w,size){
  const r=size/2;let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  CATS.forEach((c,i)=>{
    const a0=-Math.PI/2+i*Math.PI/3,a1=a0+Math.PI/3,R=r-1;
    const x0=r+R*Math.cos(a0),y0=r+R*Math.sin(a0),x1=r+R*Math.cos(a1),y1=r+R*Math.sin(a1);
    s+=`<path d="M${r} ${r}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${w.includes(c.id)?c.color:'#d9d2c0'}" stroke="#fff" stroke-width="2"/>`;
  });
  return s+'</svg>';
}

/* couleurs des pions (distinctes des couleurs de catégories) */
const TOKCOL=['#ff5964','#ffffff','#00d4ff','#c8ff00','#ff9ff3','#ffb703','#a0e548','#ff7ad9'];

/* liste ordonnée et dédupliquée des cases choisissables (dé lancé) */
function moveOptions(){
  if(game.phase!=='move'||!game.options)return [];
  const seen={};return game.options.filter(id=>{if(seen[id])return false;seen[id]=1;return true});
}

/* Plateau façon Trivial Pursuit : cases carrées, 6 rayons, centre. */
function boardPlateau(){
  const N=BOARD.nodes,A=BOARD.adj,aid=activeId();
  const optSet=new Set(moveOptions());
  const pickable=optSet.size>0&&isMyTurn();
  const viewer=(players[me.id]||players[aid]||{}), ownW=viewer.wedges||[];
  const rsq=(x,y,s,attrs)=>`<rect x="${(x-s/2).toFixed(1)}" y="${(y-s/2).toFixed(1)}" width="${s}" height="${s}" rx="${(s*0.26).toFixed(1)}" ${attrs}/>`;
  const glow=(x,y,s)=>rsq(x,y,s+18,'fill="var(--accent)" class="opt-glow"')+rsq(x,y,s+8,'fill="none" stroke="var(--accent)" stroke-width="4.5"');
  // liens
  const seen={};let lines='';
  Object.keys(A).forEach(id=>A[id].forEach(j=>{const k=id<j?id+'|'+j:j+'|'+id;if(seen[k])return;seen[k]=1;
    lines+=`<line x1="${N[id].x.toFixed(1)}" y1="${N[id].y.toFixed(1)}" x2="${N[j].x.toFixed(1)}" y2="${N[j].y.toFixed(1)}" stroke="#cdbf9f" stroke-width="6" stroke-linecap="round" opacity=".5"/>`;}));
  // cases
  let cells='',hits='';
  Object.keys(N).forEach(id=>{const nd=N[id],hot=optSet.has(id);
    if(nd.type==='hub'){
      const s=72;
      if(hot)cells+=glow(nd.x,nd.y,s);
      cells+=rsq(nd.x,nd.y,s,'fill="var(--ink)" stroke="#fff" stroke-width="3"')+`<text x="${nd.x}" y="${nd.y}" font-size="13" font-weight="700" fill="var(--bg)" text-anchor="middle" dominant-baseline="central">CENTRE</text>`;
    }else{
      const c=catById(nd.cat),s=nd.type==='hq'?46:28,got=nd.type==='hq'&&ownW.includes(nd.cat);
      if(hot)cells+=glow(nd.x,nd.y,s);
      cells+=rsq(nd.x,nd.y,s,`fill="${got?'#b9b9c6':c.color}" stroke="#fff" stroke-width="${nd.type==='hq'?3:2}"${got?' opacity="0.7"':''}`);
      if(nd.type==='hq')cells+=`<text x="${nd.x}" y="${nd.y}" font-size="22" text-anchor="middle" dominant-baseline="central"${got?' opacity="0.5"':''}>${c.icon}</text>`;
      if(got)cells+=`<text x="${(nd.x+16).toFixed(1)}" y="${(nd.y-15).toFixed(1)}" font-size="16" text-anchor="middle" dominant-baseline="central">✓</text>`;
    }
    if(hot&&pickable){const s=(nd.type==='hub'?72:nd.type==='hq'?46:28)+18;hits+=rsq(nd.x,nd.y,s,`fill="transparent" class="cell-hit" data-act="move" data-node="${id}"`);}
  });
  // pions, groupés par case
  const groups={};game.order.forEach((id,idx)=>{const p=players[id];if(!p)return;const pos=p.pos||'H';(groups[pos]=groups[pos]||[]).push({id,idx})});
  let toks='',labels='';
  Object.keys(groups).forEach(pos=>{const arr=groups[pos],base=N[pos]||N['H'];
    arr.forEach((o,k)=>{const an=k/Math.max(1,arr.length)*2*Math.PI,off=arr.length>1?16:0;
      const x=base.x+off*Math.cos(an),y=base.y+off*Math.sin(an);
      const col=tokColor(o.id,o.idx),act=o.id===aid,ini=esc((players[o.id].name||'?').slice(0,2).toUpperCase());
      toks+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">${act?'<circle r="18" fill="none" stroke="var(--accent)" stroke-width="3"/>':''}<circle r="13" fill="${col}" stroke="#15151f" stroke-width="2"/><text y="1" font-size="10" font-weight="800" fill="#15151f" text-anchor="middle" dominant-baseline="central">${ini}</text></g>`;
      const nmL=esc((players[o.id].name||'').slice(0,11)),bw=nmL.length*6.4+14,ly=y+26+k*18;
      labels+=`<g transform="translate(${x.toFixed(1)} ${ly.toFixed(1)})"><rect x="${(-bw/2).toFixed(1)}" y="-9" width="${bw.toFixed(1)}" height="18" rx="9" fill="${col}" stroke="#15151f" stroke-width="1.5"/><text y="1" font-size="10.5" font-weight="700" fill="#15151f" text-anchor="middle" dominant-baseline="central">${nmL}</text></g>`;
    });
  });
  return `<div class="plateau"><svg viewBox="0 0 470 470">${lines}${cells}${toks}${labels}${hits}</svg></div>`;
}

function viewGame(){
  const aid=activeId(), ap=players[aid];
  if(!ap)return `<div class="card center"><p>Synchronisation…</p></div>`;
  let main='';
  if(game.phase==='roll')main=viewRoll(ap);
  else if(game.phase==='move')main=viewMove(ap);
  else main=viewQuestion(ap);
  const foot=`<div class="row" style="margin-top:18px">${isHost()&&mode==='online'?`<button class="btn small alt" data-act="skip">Passer ${esc(ap.name)}</button>`:'<span></span>'}<button class="btn small alt" data-act="leave" style="margin-left:auto;flex:0 0 auto">Quitter</button></div>`;
  const leg=catLegend();
  if(screenFlag&&mode==='online')return `${leg}<div class="screengame">${boardPlateau()}<div class="screencol">${board()}${main}</div></div>${foot}`;
  return leg+boardPlateau()+board()+main+foot;
}

function viewMove(ap){
  const mine=isMyTurn();
  return `<div class="card center" style="margin-top:6px">
    <p class="muted" style="margin:0">${esc(ap.name)} a fait</p>${dieFace(game.moveN)}
    <p style="margin:6px 0 0">${mine?'👉 Touche une case <b>en surbrillance</b> sur le plateau':`${esc(ap.name)} choisit sa case…`}</p>
  </div>`;
}

function viewQuestion(ap){
  const q=game.q, cat=catById(q.cat), item=getQ(q.key);
  const texts=q.opts.map(i=>item[1+i]);
  const correctIdx=q.opts.indexOf(0);
  const isRes=game.phase==='result';
  const mine=isMyTurn();
  const sub=q.final?'Question finale':(q.wedge?'Question camembert':(q.hard?'Corsée':''));
  let opts=texts.map((t,i)=>{
    let cls='';
    if(isRes){cls=i===correctIdx?'ok':(game.result.choice===i?'ko':'dim')}
    return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${(!mine||isRes)?'disabled':''}><span class="l">${'ABCD'[i]}</span><span>${esc(t)}</span></button>`;
  }).join('');
  let extra='';
  if(isRes){
    const r=game.result;
    if(r.correct){
      extra=`<div class="verdict ok">Bonne réponse !</div><p>${q.final?'Quelle finale !':q.wedge?`${esc(ap.name)} gagne le camembert ${esc(cat.name)} !`:`${esc(ap.name)} rejoue.`}</p>`;
    }else{
      const nxt=game.order[(game.turn+1)%game.order.length];
      extra=`<div class="verdict ko">${r.choice<0?'Temps écoulé !':'Raté…'}</div><p>La bonne réponse : <b>${esc(texts[correctIdx])}</b>.</p><p class="muted">${game.order.length>1?`Au tour de ${esc(nm(nxt))}.`:'On retente !'}</p>`;
    }
    extra+=mine?`<button class="btn" data-act="next">Continuer</button>`:`<p class="muted center">En attente de ${esc(ap.name)}…</p>`;
  }else{
    extra=mine?`<div class="timer"><i id="tbar"></i></div><p class="muted" style="margin:2px 0 0;font-size:.85rem"><span id="tleft">${QTIME} s</span></p>`:`<p class="muted center" style="margin-top:10px">${esc(ap.name)} réfléchit…</p>`;
  }
  // sur un téléphone d'une partie à plateau : pas le texte de la question (il est sur l'écran), juste les réponses
  const phoneCtrl=mode==='online'&&game.board&&!screenFlag;
  const qtext=phoneCtrl
    ?(isRes?'':`<p class="muted center" style="margin:2px 0 10px">👀 Lis la question sur l'écran, réponds ici</p>`)
    :`<div class="qtext">${esc(item[0])}</div>`;
  return `<div style="margin-top:6px"><div class="qhead" style="background:${cat.color}"><span class="ic">${cat.icon}</span>${esc(cat.name)}${sub?`<span class="sub">${sub}</span>`:''}</div>
  <div class="qbody"><div class="muted" style="font-size:.85rem;margin-bottom:2px">${esc(ap.name)}</div>${qtext}<div class="opts">${opts}</div>${extra}</div></div>`;
}

function viewFinished(){
  const w=players[game.winner];
  const ids=Object.keys(players).sort((a,b)=>(players[b].wedges||[]).length-(players[a].wedges||[]).length||(players[b].ok||0)-(players[a].ok||0));
  return `<div class="winner">🏆</div>
  <h1 class="center">${esc(w?w.name:'Quelqu\'un')} remporte la partie !</h1>
  <div class="card"><ul class="plist">${ids.map(id=>{const p=players[id];return `<li>${pie(p.wedges||[],34)}<b>${esc(p.name)}</b><span class="muted" style="margin-left:auto">🧀 ${(p.wedges||[]).length}/${WEDGES_TO_WIN}</span></li>`}).join('')}</ul></div>
  ${isHost()?`<button class="btn" data-act="rematch">Nouvelle partie</button>`:`<p class="center muted">${game.board?'En attente d\'une revanche lancée depuis l\'écran de jeu…':`En attente d'une revanche proposée par ${esc(nm(game.host))}…`}</p>`}
  <button class="btn alt" data-act="leave">Quitter</button>`;
}

/* ============================================================
   TIMER & ÉVÉNEMENTS
   ============================================================ */
function syncTimer(){
  const need=screen==='game'&&game&&game.status==='playing'&&game.phase==='question'&&game.q&&isMyTurn();
  if(!need){if(timerIv){clearInterval(timerIv);timerIv=null;timerKey=null}return}
  const tick=()=>{
    const left=QTIME-(Date.now()-game.q.t0)/1000;
    const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,left/QTIME*100)+'%';
    const tl=$('#tleft');if(tl)tl.textContent=Math.max(0,Math.ceil(left))+' s';
    if(left<=0){clearInterval(timerIv);timerIv=null;timerKey=null;answer(-1)}
  };
  if(timerKey===game.q.t0){tick();return}
  clearInterval(timerIv);timerKey=game.q.t0;timerIv=setInterval(tick,200);tick();
}

function startRoll(){
  if(rolling||!isMyTurn()||game.phase!=='roll')return;
  let n=0;const steps=8+rnd(4);
  rolling={die:1+rnd(6)};render();
  const iv=setInterval(()=>{
    n++;
    if(n>=steps){clearInterval(iv);const fin=1+rnd(6);rolling={die:fin};render();setTimeout(()=>{rolling=null;rollDice(fin)},480);return}
    rolling={die:1+rnd(6)};render();
  },90+n*5);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a!=='create'&&a!=='join'){notice='';noticeErr=false}
  if(a==='create'){const n=($('#pname').value||'').trim();if(!n)return fail('Entre ton prénom.');notice='';createOnline(n.slice(0,16))}
  else if(a==='join'){const n=($('#pname').value||'').trim();if(!n)return fail('Entre ton prénom.');notice='';joinOnline(n.slice(0,16),$('#jcode').value)}
  else if(a==='screen')createScreen();
  else if(a==='resume')resume();
  else if(a==='local')startLocal();
  else if(a==='addlocal')addLocalPlayer($('#addname').value);
  else if(a==='color'){if(players[me.id])savePlayer(me.id,{color:b.dataset.col}).then(render)}
  else if(a==='lcolor')cycleLocalColor(b.dataset.id);
  else if(a==='start')startGame();
  else if(a==='roll')startRoll();
  else if(a==='move')chooseMove(b.dataset.node);
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='next')nextStep();
  else if(a==='skip')skipPlayer();
  else if(a==='rematch')rematch();
  else if(a==='leave')leave();
  else if(a==='copy'){try{navigator.clipboard.writeText(code).then(()=>toast('Code copié'),()=>toast('Code : '+code))}catch(err){toast('Code : '+code)}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='addname')addLocalPlayer(e.target.value);
});

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function initFirebase(){
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG||!FIREBASE_CONFIG.projectId)return null;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs=firebase.firestore();
    const wrapDoc=p=>{const r=fs.doc(p);return{
      set:d=>r.set(d),update:d=>r.update(d),get:()=>r.get(),
      onSnapshot:cb=>r.onSnapshot(cb,e=>toast('Synchro Firebase : '+(e.code||e.message)))
    }};
    return{doc:wrapDoc,collection:p=>{const r=fs.collection(p);return{get:()=>r.get(),onSnapshot:cb=>r.onSnapshot(cb,e=>toast('Synchro Firebase : '+(e.code||e.message)))}}};
  }catch(e){return null}
}
/* retrait de l'écran de lancement une fois l'animation terminée */
(function(){const sp=document.getElementById('splash');if(!sp)return;
  const off=()=>{sp.classList.add('gone');};
  sp.addEventListener('animationend',e=>{if(e.animationName==='splashOut'){off();setTimeout(()=>{try{sp.remove()}catch(_){}} ,50)}});
  setTimeout(off,3200);
})();
(async function init(){
  me.name=store('gc_name')||'';
  render();
  try{
    if(typeof claude!=='undefined'&&claude.use){
      userCap=await claude.use('user').catch(()=>null);
      dbh=await claude.use('db').catch(()=>null);
    }
  }catch(e){}
  if(!dbh)dbh=initFirebase();
  me.id=localId();
  capsReady=true;
  if(screen==='home')render();
})();
</script>
